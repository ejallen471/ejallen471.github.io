        <div class="page-heading">
            <h1>Contact Me</h1>
        </div>
    </header>

    <div class="page-description"><p>If you would like to have a chat about anything on the website or anything else, please get in touch using the form below.</p></div>

    <main>
        <section class="contact-section">
            <form class="contact-form" action="https://formsubmit.co/emmallen471@gmail.com" method="POST" aria-label="Contact form">
                <input type="hidden" name="_subject" value="New message from my website">
                <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="form-field">
                    <label for="contact-name">Name</label>
                    <input id="contact-name" name="name" type="text" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="contact-email">Email</label>
                    <input id="contact-email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="contact-subject">Subject</label>
                    <input id="contact-subject" name="subject" type="text" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" rows="8" required></textarea>
                </div>

                <button type="submit">Send message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-meta">
            <p>Emma Allen</p>
            <small class="last-updated"><em>Last updated September 2026</em></small>
        </div>
